<app-header [title]="title">{{ title }}</app-header>

<div class="container">
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidenav sin backdrop, controlado por [(opened)] -->
    <mat-sidenav
      mode="side"
      [(opened)]="opened"
      [disableClose]="true"
      [autoFocus]="false"
      class="sidenav"
    >
      <mat-nav-list class="navegacion">

        <!-- Verbos -->
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>Verbos principales</mat-panel-title>
          </mat-expansion-panel-header>
          <a mat-button routerLink="verbos/to-be"   routerLinkActive="active">To Be</a>
          <a mat-button routerLink="verbos/to-do"   routerLinkActive="active">To Do</a>
          <a mat-button routerLink="verbos/to-get"  routerLinkActive="active">To Get</a>
          <a mat-button routerLink="verbos/to-go"   routerLinkActive="active">To Go</a>
          <a mat-button routerLink="verbos/to-have" routerLinkActive="active">To Have</a>
          <a mat-button routerLink="verbos/to-make" routerLinkActive="active">To Make</a>
        </mat-expansion-panel>

        <!-- Vocabulario -->
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>Vocabulario</mat-panel-title>
          </mat-expansion-panel-header>
          <a mat-button routerLink="vocabulario/animales" routerLinkActive="active">Animales</a>
          <a mat-button routerLink="vocabulario/colores"  routerLinkActive="active">Colores</a>
          <a mat-button routerLink="vocabulario/compras"  routerLinkActive="active">Compras</a>
          <a mat-button routerLink="vocabulario/cuerpo"   routerLinkActive="active">El Cuerpo</a>
          <a mat-button routerLink="vocabulario/dias"     routerLinkActive="active">Días</a>
          <a mat-button routerLink="vocabulario/frutas"   routerLinkActive="active">Frutas</a>
          <a mat-button routerLink="vocabulario/meses"    routerLinkActive="active">Meses</a>
          <a mat-button routerLink="vocabulario/ropa"     routerLinkActive="active">Ropa</a>
          <a mat-button routerLink="vocabulario/viajes"   routerLinkActive="active">Viajes</a>
        </mat-expansion-panel>

        <!-- Gramática -->
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>Gramática</mat-panel-title>
          </mat-expansion-panel-header>
          <a mat-button routerLink="gramatica/articulos"       routerLinkActive="active">Artículos</a>
          <a mat-button routerLink="gramatica/pronombres"      routerLinkActive="active">Pronombres</a>
          <a mat-button routerLink="gramatica/presente-simple" routerLinkActive="active">Presente Simple</a>
          <a mat-button routerLink="gramatica/preposiciones"   routerLinkActive="active">Preposiciones</a>
        </mat-expansion-panel>

        <!-- Otros -->
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>Otros</mat-panel-title>
          </mat-expansion-panel-header>
          <a mat-button routerLink="otros/antonimos" routerLinkActive="active">Antónimos</a>
          <a mat-button routerLink="otros/sinonimos" routerLinkActive="active">Sinónimos</a>
        </mat-expansion-panel>

      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <!-- Botoncito/handle SIEMPRE visible; mueve su posición según opened -->
      <button
        class="sidenav-handle"
        type="button"
        (click)="toggleSidenav()"
        [style.left.px]="opened ? 260 : 0"
        aria-label="Mostrar/ocultar menú"
        title="Mostrar/ocultar menú"
      >
        {{ opened ? '«' : '»' }}
      </button>

      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<app-footer></app-footer>
